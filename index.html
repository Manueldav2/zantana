<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0E1A">
<title>Zantana — Party Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800;12..96,900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Brand */
    --blue:#2D5BFF;
    --red:#FF3355;
    --orange:#FF9233;
    --green:#21D26A;

    /* Tints (lighter variants for player slots 5-8) */
    --blue-l:#7CA0FF;
    --red-l:#FF8AA0;
    --orange-l:#FFC07A;
    --green-l:#7AE7A8;

    /* Neutrals */
    --bg:#0A0E1A;
    --bg-2:#131A2E;
    --bg-3:#1B2440;
    --ink:#FFFFFF;
    --ink-2:#E2E6F4;
    --ink-dim:#B5BCD9;
    --ink-muted:#7A82A0;
    --line:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.18);

    /* Accent (default brand for primary CTAs) */
    --accent:var(--orange);
    --accent-ink:#1A0E00;

    /* Type */
    --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;

    /* Spacing scale */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:48px; --s10:64px; --s11:96px;

    /* Radii */
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;

    /* Shadows */
    --sh-sm:0 4px 14px rgba(0,0,0,.35);
    --sh-md:0 12px 32px rgba(0,0,0,.45);
    --sh-lg:0 24px 60px rgba(0,0,0,.55);

    /* Motion */
    --t-fast:120ms cubic-bezier(.2,.7,.3,1);
    --t-med:220ms cubic-bezier(.2,.7,.3,1);
    --t-slow:380ms cubic-bezier(.2,.7,.3,1);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none;text-rendering:optimizeLegibility}
  body{
    background:
      radial-gradient(ellipse 80% 60% at 20% -10%, rgba(45,91,255,.22), transparent 60%),
      radial-gradient(ellipse 70% 50% at 110% 10%, rgba(255,51,85,.16), transparent 60%),
      radial-gradient(ellipse 70% 60% at 50% 120%, rgba(255,146,51,.14), transparent 60%),
      var(--bg);
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:18px 18px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 80%);
  }
  #app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}

  button,input,textarea{font-family:inherit}
  button{cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
  input,textarea{
    font:inherit;color:var(--ink);background:rgba(255,255,255,.05);
    border:2px solid var(--line);border-radius:var(--r-md);padding:16px 18px;outline:none;width:100%;
    transition:border-color var(--t-fast), background var(--t-fast);
  }
  input:focus,textarea:focus,button:focus-visible{
    border-color:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  textarea{resize:none;min-height:84px}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* Layout */
  .center{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--s6) var(--s5)}
  .stack{display:flex;flex-direction:column;gap:var(--s4);width:100%;max-width:560px}
  .stack.host{max-width:1180px}
  .row{display:flex;gap:var(--s3);flex-wrap:wrap}
  .grid{display:grid;gap:var(--s3)}

  /* Type */
  h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.025em;line-height:1.02;font-weight:900}
  h1{font-size:clamp(40px,9vw,84px)}
  h2{font-size:clamp(24px,4vw,40px)}
  .display{font-family:var(--display);font-weight:900;letter-spacing:-.04em;line-height:.95}
  .sub{color:var(--ink-dim);font-size:18px;line-height:1.5}
  .help{color:var(--ink-muted);font-size:13px;line-height:1.5;text-align:center;padding:var(--s4)}
  .footer{padding:var(--s4) var(--s5) var(--s7);text-align:center;color:var(--ink-muted);font-size:13px}

  /* Wordmark */
  .wordmark{font-family:var(--display);font-weight:900;letter-spacing:-.04em;display:inline-flex;line-height:1}
  .wordmark span{display:inline-block;transform-origin:50% 90%}
  .wordmark span:nth-child(7n+1){color:var(--blue)}
  .wordmark span:nth-child(7n+2){color:var(--red)}
  .wordmark span:nth-child(7n+3){color:var(--orange)}
  .wordmark span:nth-child(7n+4){color:var(--green)}
  .wordmark span:nth-child(7n+5){color:var(--blue)}
  .wordmark span:nth-child(7n+6){color:var(--red)}
  .wordmark span:nth-child(7n+7){color:var(--orange)}
  .wordmark.title{font-size:clamp(72px,18vw,200px)}
  .wordmark.title span:nth-child(odd){transform:rotate(-3deg) translateY(-2%)}
  .wordmark.title span:nth-child(even){transform:rotate(2deg) translateY(2%)}
  .wordmark.sm{font-size:22px;letter-spacing:-.03em}

  /* Bouncy idle wobble (respects reduced motion) */
  @keyframes wobble{
    0%,100%{transform:rotate(-3deg) translateY(-2%)}
    50%{transform:rotate(-5deg) translateY(-4%)}
  }
  @keyframes wobble2{
    0%,100%{transform:rotate(2deg) translateY(2%)}
    50%{transform:rotate(4deg) translateY(4%)}
  }
  .wordmark.title span:nth-child(odd){animation:wobble 4.5s ease-in-out infinite}
  .wordmark.title span:nth-child(even){animation:wobble2 4.5s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){
    .wordmark.title span{animation:none !important}
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
    padding:18px 24px;min-height:52px;border-radius:var(--r-md);
    background:var(--accent);color:var(--accent-ink);
    font-family:var(--body);font-weight:800;font-size:17px;letter-spacing:.005em;
    transition:transform var(--t-fast), filter var(--t-fast), box-shadow var(--t-med), background var(--t-fast);
    box-shadow:0 8px 0 0 color-mix(in srgb, var(--accent) 60%, #000), var(--sh-sm);
    text-align:center;will-change:transform;
  }
  .btn:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 10px 0 0 color-mix(in srgb, var(--accent) 60%, #000), var(--sh-md)}
  .btn:active{transform:translateY(2px);box-shadow:0 4px 0 0 color-mix(in srgb, var(--accent) 60%, #000), var(--sh-sm)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 8px 0 0 color-mix(in srgb, var(--accent) 60%, #000)}
  .btn.lg{padding:22px 28px;font-size:19px;min-height:60px;border-radius:18px}
  .btn.alt{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:0 8px 0 0 rgba(255,255,255,.12), var(--sh-sm)}
  .btn.alt:hover{background:rgba(255,255,255,.12)}
  .btn.alt:active{box-shadow:0 4px 0 0 rgba(255,255,255,.12), var(--sh-sm)}
  .btn.blue{--accent:var(--blue);--accent-ink:#fff}
  .btn.red{--accent:var(--red);--accent-ink:#fff}
  .btn.green{--accent:var(--green);--accent-ink:#0a1f10}
  .btn .ico{width:20px;height:20px;flex:0 0 20px}

  /* Pills / chips */
  .pill{display:inline-flex;align-items:center;gap:var(--s2);padding:10px 14px;border-radius:var(--r-pill);background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:700;font-size:14px}
  .pill .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
  .smallcode{font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.18em;font-weight:900;font-size:16px}

  /* Header */
  .header{display:flex;justify-content:space-between;align-items:center;padding:var(--s5) var(--s6);gap:var(--s3);flex-wrap:wrap}
  .header .row{gap:var(--s2)}

  /* Cards */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
    border:2px solid var(--line);border-radius:var(--r-lg);padding:var(--s6);
    backdrop-filter:blur(8px);
  }
  .player-card{
    display:flex;align-items:center;gap:var(--s3);
    background:rgba(255,255,255,.06);border:2px solid var(--line);
    padding:14px 18px;border-radius:var(--r-md);font-weight:700;font-size:18px;
    transition:transform var(--t-fast), border-color var(--t-fast), background var(--t-fast);
  }
  .player-card .dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .player-card.fresh{animation:popIn 380ms cubic-bezier(.2,1.4,.3,1)}
  @keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

  /* Prompt boxes */
  .prompt-box{
    background:linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 100%);
    border:2px solid var(--line-2);border-radius:var(--r-lg);
    padding:var(--s6);font-size:18px;font-weight:600;line-height:1.4
  }
  .prompt-big{
    font-family:var(--display);font-weight:900;letter-spacing:-.02em;line-height:1.05;
    font-size:clamp(28px,7vw,68px);text-align:center;padding:var(--s7) var(--s5);
  }
  .prompt-big::before,.prompt-big::after{color:var(--ink-muted);font-weight:800;display:inline-block;transform:translateY(-.1em);padding:0 .15em}

  /* Answer / vote cards */
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
  .answer-card{
    background:rgba(255,255,255,.05);border:3px solid var(--line-2);border-radius:var(--r-lg);
    padding:var(--s6);min-height:140px;display:flex;flex-direction:column;justify-content:space-between;
    cursor:pointer;text-align:left;
    font-family:var(--display);font-size:clamp(20px,3.4vw,28px);font-weight:700;line-height:1.25;
    transition:transform var(--t-med),border-color var(--t-fast),box-shadow var(--t-med),background var(--t-fast);
  }
  .answer-card:hover{transform:translateY(-4px);box-shadow:var(--sh-md);background:rgba(255,255,255,.08)}
  .answer-card.voted{transform:scale(.97);box-shadow:none;background:rgba(255,255,255,.1)}
  .answer-card .author{font-family:var(--body);font-size:13px;color:var(--ink-muted);font-weight:800;margin-top:14px;text-transform:uppercase;letter-spacing:.1em}
  .versus{
    font-family:var(--display);font-size:64px;font-weight:900;text-align:center;
    color:var(--ink-muted);margin:var(--s2) 0;letter-spacing:-.04em;
    background:linear-gradient(180deg,var(--orange),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .vote-bar{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
  .vote-bar > div{height:100%;border-radius:5px;transition:width .65s cubic-bezier(.2,.7,.3,1)}

  /* Timer */
  .timer{
    position:fixed;top:calc(var(--s4) + env(safe-area-inset-top));right:var(--s4);
    background:rgba(10,14,26,.78);backdrop-filter:blur(10px);
    padding:12px 18px;border-radius:var(--r-md);font-family:var(--display);
    font-weight:900;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    border:2px solid var(--line-2);z-index:30;
  }
  .timer.warn{color:var(--red);border-color:var(--red);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .timer-mega{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:25;
    font-family:var(--display);font-weight:900;font-size:min(60vw,500px);color:var(--red);
    text-shadow:0 0 60px rgba(255,51,85,.45);opacity:.18;
  }

  /* Lobby */
  .lobby-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--s8);align-items:center}
  .code-stack{text-align:center}
  .code-huge{
    font-family:var(--display);font-weight:900;letter-spacing:.16em;
    font-size:clamp(96px,22vw,260px);line-height:.9;
    background:linear-gradient(180deg,#fff 0%, var(--blue-l) 60%, var(--blue) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 12px 64px rgba(45,91,255,.5);
  }
  .url-line{font-weight:800;font-size:clamp(18px,2vw,26px);word-break:break-all;color:var(--ink-2)}
  .url-line .domain{color:var(--ink-muted);font-weight:700}

  /* Scoreboard */
  .scoreboard{display:grid;gap:var(--s3);max-width:560px;margin:0 auto}
  .score-row{
    display:flex;align-items:center;gap:var(--s4);
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    padding:var(--s4) var(--s5);border-radius:var(--r-md);font-size:20px;
    border-left:6px solid var(--accent);
  }
  .score-row .rank{font-family:var(--display);font-weight:900;width:32px;font-size:22px;color:var(--ink-muted)}
  .score-row .nm{flex:1;font-weight:800}
  .score-row .pts{font-family:var(--display);font-weight:900;font-variant-numeric:tabular-nums;font-size:22px}
  .score-row.me{outline:2px solid #fff}

  /* Final winner */
  .winner-name{
    font-family:var(--display);font-weight:900;letter-spacing:-.04em;line-height:.9;
    text-align:center;padding:var(--s7) var(--s4);
    font-size:clamp(72px,18vw,220px);
    background:linear-gradient(180deg, var(--orange) 0%, var(--red) 50%, var(--blue) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 12px 40px rgba(255,51,85,.35));
  }

  /* Toast */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#0b0717;font-weight:800;padding:14px 22px;border-radius:14px;box-shadow:var(--sh-lg);z-index:50}

  /* Status dot for connection */
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-muted);display:inline-block}
  .status-dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
  .status-dot.bad{background:var(--red)}

  /* Empty / waiting */
  .empty-state{text-align:center;color:var(--ink-muted);padding:var(--s10) var(--s5);font-size:18px;font-weight:600}

  /* Animations */
  .fade-in{animation:fadeIn 380ms cubic-bezier(.2,.7,.3,1)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  /* Character avatars */
  .avatar{flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));display:inline-block}
  .avatar-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
  .avatar-name{font-family:var(--display);font-weight:900;letter-spacing:-.01em;font-size:16px;background:#0a0e1a;color:#fff;padding:4px 12px;border-radius:999px;border:2px solid #fff;text-shadow:none}

  /* Quick-fill suggestion pills */
  .quick-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .quick-pill{
    background:rgba(255,255,255,.06);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    color:var(--ink-dim);
    cursor:pointer;
    transition:background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
    line-height:1.2;
  }
  .quick-pill:hover{background:rgba(255,146,51,.16);border-color:var(--orange);color:var(--orange);transform:translateY(-1px)}
  .quick-pill:active{transform:translateY(1px)}

  /* Active toggle button (for settings) */
  .btn.alt.active{background:var(--orange);color:var(--accent-ink);box-shadow:0 4px 0 0 color-mix(in srgb, var(--orange) 60%, #000), var(--sh-sm)}

  /* Fill-in-the-blank */
  .blank-ph{
    display:inline-block;min-width:90px;
    border-bottom:4px solid var(--orange);
    margin:0 .15em .05em;height:.55em;vertical-align:baseline;
    background:linear-gradient(180deg, transparent 0%, rgba(255,146,51,.12) 100%);
    border-radius:3px 3px 0 0;
  }
  .blank-filled{
    background:rgba(255,146,51,.18);border-radius:6px;
    padding:.02em .35em;font-weight:900;color:var(--orange);
    border-bottom:3px solid var(--orange);
  }

  /* AI panel */
  .ai-panel{
    margin-top:var(--s3);padding:var(--s4);
    border:2px dashed rgba(255,146,51,.35);border-radius:var(--r-md);
    background:rgba(255,146,51,.04);
  }
  .ai-panel summary{
    cursor:pointer;font-weight:800;font-size:14px;
    list-style:none;display:flex;align-items:center;gap:.5em;color:var(--orange);
  }
  .ai-panel summary::-webkit-details-marker{ display:none }
  .ai-panel summary::before{
    content:'+';display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;background:var(--orange);color:#1a0e00;
    border-radius:50%;font-weight:900;font-size:16px;line-height:1;
  }
  .ai-panel[open] summary::before{ content:'−' }
  .ai-status{margin-top:var(--s3);font-weight:700;font-size:13px;color:var(--ink-dim);min-height:1.2em}
  .ai-status.ok{color:var(--green)}
  .ai-status.err{color:var(--red)}

  /* Responsive */
  @media (max-width:780px){
    .answers{grid-template-columns:1fr}
    .lobby-grid{grid-template-columns:1fr;gap:var(--s6)}
    .header{padding:var(--s4) var(--s5)}
    h1{font-size:clamp(36px,12vw,72px)}
    .versus{font-size:48px}
  }
  @media (max-width:480px){
    .center{padding:var(--s5) var(--s4)}
    .btn{width:100%}
    .btn.lg{padding:20px;font-size:18px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script type="module">
const MQTT_URL = 'wss://broker.emqx.io:8084/mqtt';
const TOPIC_PREFIX = 'zantana2026';

function makeChannel(){
  const client = mqtt.connect(MQTT_URL, {
    clientId: TOPIC_PREFIX+'_'+Math.random().toString(36).slice(2,10),
    keepalive: 30, reconnectPeriod: 2000, connectTimeout: 8000, clean: true,
  });
  const handlers = {};
  client.on('message', (topic, buf) => {
    try { const msg = JSON.parse(buf.toString());
      for(const fn of (handlers[msg.event]||[])) fn(msg.payload);
    } catch(e){ console.error('msg parse', e); }
  });
  return {
    client,
    onConnect(fn){ if(client.connected) fn(); else client.on('connect', fn); },
    on(event, fn){ (handlers[event] = handlers[event] || []).push(fn); },
    sub(topic){ client.subscribe(topic, { qos: 1 }); },
    pub(topic, event, payload, opts={}){
      client.publish(topic, JSON.stringify({ event, payload }), { qos: 1, retain: !!opts.retain });
    },
    end(){ try { client.end(true); } catch{} }
  };
}

// Player slot palette: 4 brand colors then 4 lighter tints
const COLORS = ['#2D5BFF','#FF3355','#FF9233','#21D26A','#7CA0FF','#FF8AA0','#FFC07A','#7AE7A8'];

const BOT_NAMES = ['Bingo Bot','Crispy','Pickles','Zorb','Sir Toots','Marbles','Goose','Yeet','Lord Bork','Janky'];
const BOT_ANSWERS = [
  "A wet sandwich","Gary, but louder","Tax season","My nan's nightie","An ankle full of regret",
  "Two ferrets in a trenchcoat","Disappointment soup","The smell of an Uber","Bones, but cute","A haunted toaster",
  "Pretending to like jazz","Phil from accounting","A loaf of unsolicited advice","Crying at IKEA","A dad joke gone wrong",
  "Sentient mayonnaise","Crocs, but spicy","Whatever's in the back of the fridge","A motivational ferret","The 4am gas station",
  "Posture goblin","An aggressively damp napkin","Just vibes","A pigeon with a plan","Soup on Tuesday",
  "Eight unread voicemails","A confused Roomba","Putting cilantro on everything","The wifi at grandma's","Glenn",

function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function parseHash(){
  const h = location.hash.replace(/^#/,'');
  if(!h) return {view:'home'};
  const [path, query] = h.split('?');
  const params = new URLSearchParams(query||'');
  if(path.startsWith('host/')) return {view:'host', code:path.slice(5).toUpperCase(), dev: params.has('dev')};
  if(path.startsWith('p/')) return {view:'player', code:path.slice(2).toUpperCase()};
  return {view:'home'};
}

}

const SETTINGS_VERSION = 2;
function loadSettings(){
  try {
    const raw = localStorage.getItem('zantana_settings');
    if(raw){
      const s = JSON.parse(raw);
      if(s.v === SETTINGS_VERSION){
        return { v:SETTINGS_VERSION, rounds:s.rounds||3, answerSec:s.answerSec||60, voteSec:s.voteSec||25 };
      }
    }
  } catch{}
  return { v:SETTINGS_VERSION, rounds: 3, answerSec: 60, voteSec: 25 };
}
function saveSettings(s){ localStorage.setItem('zantana_settings', JSON.stringify({...s, v:SETTINGS_VERSION})); }

function initHostState(){
  const settings = loadSettings();
  hostState = {
    phase: 'lobby', round: 0, totalRounds: settings.rounds,
    settings,
    players: {}, prompts: [], voteIdx: 0, deadline: 0,
    customPrompts: null,
  };
}

function ensureHostChannel(){
  if(channel) return;
  channel = makeChannel();
  channel.on('hello', payload => {
    const { id, name } = payload;
    if(!hostState.players[id]){
      const color = COLORS[Object.keys(hostState.players).length % COLORS.length];
      hostState.players[id] = { name: String(name||'').slice(0,20), score: 0, color };
      broadcastState();
      maybeDevAutoStart();
    } else if(hostState.players[id].name !== name){
      hostState.players[id].name = String(name||'').slice(0,20);
      broadcastState();
    }
  });
  channel.on('answer', payload => {
    if(hostState.phase!=='answering') return;
    const p = hostState.prompts.find(x=>x.id===payload.promptId);
    if(!p) return;
    if(!p.a.includes(payload.pid)) return;
    p.ans[payload.pid] = String(payload.text||'').slice(0,140);
    broadcastState();
    if(allAnswersIn()){ startVoting(); }
  });
  channel.on('vote', payload => {
    if(hostState.phase!=='voting') return;
    const p = hostState.prompts[hostState.voteIdx];
    if(!p || p.id!==payload.promptId) return;
    if(p.a.includes(payload.voterId)) return;
    if(!hostState.players[payload.voterId]) return;
    p.votes[payload.voterId] = payload.choice==='a'?'a':'b';
    broadcastState();
    if(allVotesIn(p)) advanceVote(true);
  });
  channel.onConnect(()=>{
    channel.sub(`${TOPIC_PREFIX}/${roomCode}/cmd`);
    broadcastState();
  });
}

function broadcastState(){
  if(!channel) return;
  viewState = JSON.parse(JSON.stringify(hostState));
  channel.pub(`${TOPIC_PREFIX}/${roomCode}/state`, 'state', { s: viewState, t: Date.now() }, { retain: true });
  hostRender();
}

function allAnswersIn(){
  return hostState.prompts.every(p => p.a.every(pid => !!p.ans[pid] && p.ans[pid].trim().length));
}
function allVotesIn(p){
  const voters = Object.keys(hostState.players).filter(pid => !p.a.includes(pid));
  return voters.every(v => p.votes[v]);
}

function pairPrompts(){
  const ids = Object.keys(hostState.players);
  if(ids.length<3) return [];
  const n = ids.length;
  const shuffled = [...ids].sort(()=>Math.random()-0.5);
  const base = (hostState.customPrompts && hostState.customPrompts.length >= 3) ? hostState.customPrompts : PROMPTS;
  const promptsPool = [...base].sort(()=>Math.random()-0.5);
  const result = [];
  for(let i=0;i<n;i++){
    const a = shuffled[i];
    const b = shuffled[(i+1)%n];
    result.push({
      id: crypto.randomUUID().slice(0,8),
      text: promptsPool[i % promptsPool.length],
      a: [a,b], ans: {}, votes: {}
    });
  }
  return result;
}

function startGame(){
  if(Object.keys(hostState.players).length<3){ toast('Need at least 3 players'); return; }
  hostState.round = 1;
  startRound();
}

async function generatePromptsAI(context, apiKey){
  const prompt = `You are generating fill-in-the-blank prompts for a Quiplash-style party game played by a specific group of friends. Use the context below to make funny, edgy prompts that reference the friends and their inside jokes.

CONTEXT ABOUT THE GROUP:
---
${context}
---

Generate exactly 20 fill-in-the-blank prompts. Rules:
1. Each prompt MUST contain exactly one blank, written as "___" (three underscores).
2. 5-15 words per prompt.
3. Reference specific people, events, or inside jokes from the context when natural.
4. Edgy, playful, pop-culture-aware, party-game energy.
5. Vary the format: setups, scenarios, "what would X do", "X's tinder bio", "the reason X did Y", etc.
6. Avoid slurs, content sexualizing minors, doxxing info, calls to real-world violence.

Return ONLY a JSON array of 20 strings. No markdown, no commentary.

Example format (substitute your own people/jokes):
["Sophie's hidden talent: ___", "Reason ___ got banned from Costco", "What Marcus would do at his own funeral: ___", "The Sephora cashier called ___ because: ___"]
Wait — the last one has two blanks, not allowed. Single blank per prompt.

Try again:
["Sophie's hidden talent: ___", "Reason ___ got banned from Costco", "What Marcus would do at his own funeral: ___", "Jess's tinder bio just says: ___"]`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 1.0,
      responseMimeType: 'application/json',
      responseSchema: { type: 'array', items: { type: 'string' } }
    },
    safetySettings: [
      { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_ONLY_HIGH' }
    ]
  };
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(!res.ok){
    const err = await res.text();
    throw new Error('Gemini ' + res.status + ' — ' + err.slice(0,200));
  }
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  let parsed;
  try { parsed = JSON.parse(text); }
  catch(e){
    const m = text.match(/\[[\s\S]*\]/); if(m) parsed = JSON.parse(m[0]); else throw new Error('AI returned non-JSON');
  }
  if(!Array.isArray(parsed)) throw new Error('AI response not an array');
  return parsed.map(s=>String(s||'').trim()).filter(s=>s.length>=4).slice(0,30);
}

function maybeDevAutoStart(){
  if(!route.dev) return;
  if(hostState.phase !== 'lobby') return;
  if(hostState.autoStartScheduled) return;
  if(Object.keys(hostState.players).length < 3) return;
  hostState.autoStartScheduled = true;
  hostState.autoStartAt = Date.now() + 2500;
  broadcastState();
  setTimeout(()=>{ if(hostState.phase==='lobby') startGame(); }, 2500);
}

function addBot(){
  const total = Object.keys(hostState.players).length;
  if(total >= 8){ toast('Room full'); return; }
  const used = new Set(Object.values(hostState.players).map(p=>p.name));
  const free = BOT_NAMES.filter(n=>!used.has(n));
  const name = free[Math.floor(Math.random()*free.length)] || `Bot ${total+1}`;
  const id = 'bot-' + crypto.randomUUID().slice(0,8);
  const color = COLORS[total % COLORS.length];
  hostState.players[id] = { name, score: 0, color, isBot: true };
  broadcastState();
  maybeDevAutoStart();
}

function scheduleBotAnswers(){
  if(hostState.phase !== 'answering') return;
  for(const p of hostState.prompts){
    for(const pid of p.a){
      if(!hostState.players[pid]?.isBot) continue;
      if(p.ans[pid]) continue;
      const delay = 1500 + Math.random()*7000;
      setTimeout(()=>{
        if(hostState.phase !== 'answering') return;
        if(p.ans[pid]) return;
        p.ans[pid] = BOT_ANSWERS[Math.floor(Math.random()*BOT_ANSWERS.length)];
        broadcastState();
        if(allAnswersIn()) startVoting();
      }, delay);
    }
  }
}

function scheduleBotVotes(){
  if(hostState.phase !== 'voting') return;
  const p = hostState.prompts[hostState.voteIdx];
  if(!p) return;
  for(const id of Object.keys(hostState.players)){
    if(!hostState.players[id]?.isBot) continue;
    if(p.a.includes(id)) continue;
    if(p.votes[id]) continue;
    const delay = 1200 + Math.random()*5000;
    setTimeout(()=>{
      if(hostState.phase !== 'voting') return;
      const cur = hostState.prompts[hostState.voteIdx];
      if(!cur || cur.id !== p.id) return;
      if(cur.votes[id]) return;
      cur.votes[id] = Math.random() < 0.5 ? 'a' : 'b';
      broadcastState();
      if(allVotesIn(cur)) advanceVote(true);
    }, delay);
  }
}

function startRound(){
  hostState.phase = 'answering';
  hostState.prompts = pairPrompts();
  hostState.voteIdx = 0;
  hostState.deadline = Date.now() + (hostState.settings.answerSec*1000);
  broadcastState();
  scheduleBotAnswers();
  startTimer(()=>{ fillMissingAnswers(); startVoting(); });
}

function fillMissingAnswers(){
  for(const p of hostState.prompts){
    for(const pid of p.a){
      if(!p.ans[pid] || !p.ans[pid].trim()) p.ans[pid] = '(no answer)';
    }
  }
}

function startVoting(){
  stopTimer();
  hostState.phase = 'voting';
  hostState.voteIdx = 0;
  hostState.deadline = Date.now() + (hostState.settings.voteSec*1000);
  broadcastState();
  scheduleBotVotes();
  startTimer(()=>advanceVote(false));
}

function advanceVote(everyoneVoted){
  stopTimer();
  const p = hostState.prompts[hostState.voteIdx];
  const counts = { a:0, b:0 };
  for(const v of Object.values(p.votes)){ counts[v]++; }
  const pointsPerVote = 500 * hostState.round;
  const [aId, bId] = p.a;
  hostState.players[aId].score += counts.a * pointsPerVote;
  hostState.players[bId].score += counts.b * pointsPerVote;
  hostState.deadline = Date.now() + 4500;
  hostState.phase = 'reveal';
  broadcastState();
  if(role==='host' && (counts.a>0 || counts.b>0)) fireConfetti({ particleCount:60, origin:{y:.4} });
  // Worker timer (not setTimeout) so background tabs still advance
  startTimer(()=>{
    if(hostState.voteIdx < hostState.prompts.length-1){
      hostState.voteIdx++;
      hostState.phase = 'voting';
      hostState.deadline = Date.now() + (hostState.settings.voteSec*1000);
      broadcastState();
      scheduleBotVotes();
      startTimer(()=>advanceVote(false));
    } else {
      endRound();
    }
  });
}

function endRound(){
  hostState.phase = 'scores';
  hostState.deadline = Date.now() + 8000;
  broadcastState();
  if(role==='host') fireConfetti({ particleCount:100, spread:120, origin:{y:.3} });
  startTimer(()=>{
    if(hostState.round < hostState.totalRounds){
      hostState.round++; startRound();
    } else {
      hostState.phase = 'final';
      broadcastState();
      if(role==='host') fireBigConfetti();
    }
  });
}

function resetGame(){
  for(const id of Object.keys(hostState.players)) hostState.players[id].score = 0;
  hostState.phase='lobby'; hostState.round=0; hostState.prompts=[]; hostState.voteIdx=0;
  broadcastState();
}

// Web Worker ticker — fires even when the tab is backgrounded (browsers throttle setInterval in hidden tabs)
let _tickWorker = null;
let _tickFn = null;
function ensureTickWorker(){
  if(_tickWorker) return;
  const code = `let h; self.onmessage = e => {
    if(e.data === 'start'){ if(h) clearInterval(h); h = setInterval(()=>postMessage(0), 200); }
    else if(e.data === 'stop'){ if(h){ clearInterval(h); h = null; } }
  };`;
  try {
    _tickWorker = new Worker(URL.createObjectURL(new Blob([code], { type:'application/javascript' })));
    _tickWorker.onmessage = ()=>{ if(_tickFn) try { _tickFn(); } catch(e){ console.error(e); } };
  } catch(e){ console.error('Worker init failed, falling back to setInterval', e); }
}
function startTimer(onExpire){
  ensureTickWorker();
  let lastSec = -1;
  _tickFn = ()=>{
    const left = Math.max(0, hostState.deadline - Date.now());
    if(left<=0){ stopTimer(); onExpire(); return; }
    const sec = Math.ceil(left/1000);
    if(sec === lastSec) return;
    lastSec = sec;
    if(role==='host') hostRender();
  };
  if(_tickWorker){ _tickWorker.postMessage('start'); }
  else {
    // Fallback to setInterval if Worker unavailable
    if(timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(()=>{ if(_tickFn) _tickFn(); }, 250);
  }
}
function stopTimer(){
  if(_tickWorker) _tickWorker.postMessage('stop');
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  _tickFn = null;
}

// ---------------- Host UI ----------------
function hostRender(){
  const s = hostState;
  const left = Math.max(0, Math.ceil((s.deadline - Date.now())/1000));
  const showTimer = ['answering','voting'].includes(s.phase);
  const megaTimer = showTimer && left<=3 && left>0 ? `<div class="timer-mega">${left}</div>` : '';

  let body = '';
  if(s.phase==='lobby') body = renderHostLobby();
  else if(s.phase==='answering') body = renderHostAnswering();
  else if(s.phase==='voting' || s.phase==='reveal') body = renderHostVoting(s.phase==='reveal');
  else if(s.phase==='scores') body = renderHostScores();
  else if(s.phase==='final') body = renderHostFinal();

  app.innerHTML = `
    ${showTimer ? `<div class="timer ${left<=5?'warn':''}">${left}s</div>` : ''}
    ${megaTimer}
    <div class="header">
      <div>${wordmarkHTML('ZANTANA','sm')}</div>
      <div class="row">
        <div class="pill">Room <span class="smallcode">${roomCode}</span></div>
        <div class="pill">Round ${s.round||0}/${s.totalRounds}</div>
        <div class="pill">${Object.keys(s.players).length} player${Object.keys(s.players).length===1?'':'s'}</div>
        <button class="pill" id="exitBtn" style="background:rgba(255,51,85,.16);color:var(--red);border-color:rgba(255,51,85,.35);cursor:pointer">Exit</button>
      </div>
    </div>
    <div class="center"><div class="stack host fade-in">${body}</div></div>
  `;

  if(s.phase==='lobby'){
    const btn = document.getElementById('startBtn');
    if(btn){ btn.disabled = Object.keys(s.players).length < 3; btn.onclick = startGame; }
    const botB = document.getElementById('botBtn');
    if(botB) botB.onclick = addBot;
    const cpy = document.getElementById('copyBtn');
    if(cpy) cpy.onclick = async ()=>{
      const url = location.origin + location.pathname + '#p/' + roomCode;
      try { await navigator.clipboard.writeText(url); cpy.textContent='Copied ✓'; setTimeout(()=>cpy.textContent='Copy link', 1600); }
      catch{ toast('Copy failed — long-press the link'); }
    };
    // Settings buttons
    document.querySelectorAll('[data-setting]').forEach(grp=>{
      const key = grp.dataset.setting;
      grp.querySelectorAll('[data-val]').forEach(b=>{
        b.onclick = ()=>{
          const val = parseInt(b.dataset.val);
          hostState.settings[key] = val;
          if(key==='rounds') hostState.totalRounds = val;
          saveSettings(hostState.settings);
          broadcastState();
        };
      });
    });
    // Use custom prompts
    const useBtn = document.getElementById('usePromptsBtn');
    if(useBtn) useBtn.onclick = ()=>{
      const ta = document.getElementById('customPrompts');
      const text = ta.value;
      const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>=4);
      if(lines.length < 3){ toast('Need at least 3 prompts (one per line)'); return; }
      hostState.customPromptsText = text;
      hostState.customPrompts = lines;
      toast(`Loaded ${lines.length} custom prompts`);
      broadcastState();
    };
    // AI generate
    const genBtn = document.getElementById('genBtn');
    if(genBtn){
      const savedKey = localStorage.getItem('zantana_gemini_key');
      if(savedKey){ const ki = document.getElementById('keyInput'); if(ki && !ki.value) ki.value = savedKey; }
      genBtn.onclick = async ()=>{
        const ctx = (document.getElementById('ctxInput').value||'').trim();
        const key = (document.getElementById('keyInput').value||'').trim();
        const status = document.getElementById('genStatus');
        if(!ctx){ status.className='ai-status err'; status.textContent='Paste some context first.'; return; }
        if(!key){ status.className='ai-status err'; status.textContent='Need a Gemini API key (free at aistudio.google.com/apikey).'; return; }
        localStorage.setItem('zantana_gemini_key', key);
        status.className='ai-status'; status.textContent='Generating prompts… can take 10–20s';
        genBtn.disabled = true;
        try {
          const prompts = await generatePromptsAI(ctx, key);
          if(!Array.isArray(prompts) || prompts.length < 5) throw new Error('Got too few prompts back');
          hostState.customPrompts = prompts;
          hostState.customPromptsText = prompts.join('\n');
          const ta = document.getElementById('customPrompts'); if(ta) ta.value = prompts.join('\n');
          status.className='ai-status ok'; status.textContent='✓ Got '+prompts.length+' prompts. Click Start Game.';
          broadcastState();
        } catch(e){
          status.className='ai-status err'; status.textContent='Error: '+e.message;
        } finally { genBtn.disabled = false; }
      };
    }
  }
  if(s.phase==='final'){
    const ag = document.getElementById('againBtn');
    if(ag) ag.onclick = resetGame;
  }
  const exitB = document.getElementById('exitBtn');
  if(exitB) exitB.onclick = leaveGame;
}

function renderHostAnswering(){
  const total = hostState.prompts.length * 2;
  const done = hostState.prompts.reduce((acc,p)=>acc + Object.values(p.ans).filter(t=>t&&t.trim()).length, 0);
  const pending = [];
  for(const p of hostState.prompts){
    for(const pid of p.a){
      if(!p.ans[pid] || !p.ans[pid].trim()){
        pending.push({ name: hostState.players[pid]?.name, color: hostState.players[pid]?.color });
      }
    }
  }
  const pct = Math.round(done/total*100);
  return `
    <h2 style="text-align:center">Round ${hostState.round} — Answer the prompts!</h2>
    <div class="prompt-big" style="font-size:clamp(22px,3.5vw,38px);color:var(--ink-dim);font-weight:700">Check your phone. Type the funniest answer.</div>
    <div style="text-align:center">
      <div class="display" style="font-size:clamp(48px,9vw,96px)">${done} <span style="color:var(--ink-muted);font-size:.5em">/ ${total}</span></div>
      <div class="vote-bar" style="max-width:420px;margin:var(--s3) auto;height:14px"><div style="width:${pct}%;background:linear-gradient(90deg,var(--orange),var(--red))"></div></div>
    </div>
    <div class="players">
      ${pending.map(p=>`<div class="player-card" style="opacity:.65"><span class="dot" style="background:${p.color}"></span>${escapeHtml(p.name||'?')} typing…</div>`).join('')}
    </div>
  `;
}

function renderHostVoting(reveal){
  const s = hostState;
  const p = s.prompts[s.voteIdx];
  const [aId,bId] = p.a;
  const aP = s.players[aId], bP = s.players[bId];
  const counts = { a:0, b:0 };
  for(const v of Object.values(p.votes)) counts[v]++;
  const total = counts.a + counts.b || 1;
  const aPct = counts.a/total*100, bPct = counts.b/total*100;
  const hasBlank = /_{3,}/.test(p.text);
  // Stay anonymous (neutral border) until reveal — no color leaks
  const neutral = 'rgba(255,255,255,.18)';
  const aBorder = reveal ? aP.color : neutral;
  const bBorder = reveal ? bP.color : neutral;
  const aFilled = renderFilled(p.text, p.ans[aId], reveal ? aP.color : 'var(--orange)');
  const bFilled = renderFilled(p.text, p.ans[bId], reveal ? bP.color : 'var(--orange)');
  return `
    ${hasBlank ? '' : `<div class="prompt-big">"${escapeHtml(p.text)}"</div>`}
    <div class="answers">
      <div class="answer-card" style="border-color:${aBorder}">
        <div>${aFilled || escapeHtml(p.ans[aId])}</div>
        <div>
          ${reveal ? `<div class="author" style="color:${aP.color}">${escapeHtml(aP.name)} · ${counts.a} vote${counts.a===1?'':'s'}</div>
            <div class="vote-bar"><div style="width:${aPct}%;background:${aP.color}"></div></div>` : ''}
        </div>
      </div>
      <div class="answer-card" style="border-color:${bBorder}">
        <div>${bFilled || escapeHtml(p.ans[bId])}</div>
        <div>
          ${reveal ? `<div class="author" style="color:${bP.color}">${escapeHtml(bP.name)} · ${counts.b} vote${counts.b===1?'':'s'}</div>
            <div class="vote-bar"><div style="width:${bPct}%;background:${bP.color}"></div></div>` : ''}
        </div>
      </div>
    </div>
    <div style="text-align:center;color:var(--ink-muted);font-weight:700">${reveal?'Tally':'Vote on your phone'} · pair ${s.voteIdx+1} of ${s.prompts.length}</div>
  `;
}

function renderPlayer(){
  role='player';
  roomCode = route.code;
  if(!me.name){ return renderNameEntry(); }
  ensurePlayerChannel();

}

function renderNameEntry(){
  app.innerHTML = `
    <div class="header"><div>${wordmarkHTML('ZANTANA','sm')}</div></div>
    <div class="center"><div class="stack">
      <h1>Room ${roomCode}</h1>
      <div class="sub">What name should everyone roast?</div>

    </div></div>
  `;
  const inp = document.getElementById('nm');
  inp.value = me.name || '';
  setTimeout(()=>inp.focus(), 50);
  function go(){
    const v = (inp.value||'').trim();
    if(v.length<1){ inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); return; }

    renderPlayer();

function ensurePlayerChannel(){
  if(channel) return;
  channel = makeChannel();
  channel.on('state', payload => { viewState = payload.s; playerRender(); });
  channel.onConnect(()=>{
    channel.sub(`${TOPIC_PREFIX}/${roomCode}/state`);
    sendHello();
    setTimeout(sendHello, 700);
    setTimeout(sendHello, 2000);
  });
  setInterval(()=>{ if(role==='player') playerRender(); }, 500);
}
function sendHello(){
  channel.pub(`${TOPIC_PREFIX}/${roomCode}/cmd`, 'hello', { id: me.id, name: me.name });
}

function playerSig(s, myP){
  const base = `${s.phase}|${s.round}|${s.voteIdx}|${Object.keys(s.players).length}|${myP?.score||0}|${s.autoStartScheduled?1:0}`;
  if(s.phase==='answering'){
    const mine = s.prompts.filter(p => p.a.includes(me.id));
    return base + '|' + mine.map(p => p.id).join(',');
  }
  if(s.phase==='voting' || s.phase==='reveal'){
    const p = s.prompts[s.voteIdx];
    const myVote = p ? p.votes[me.id]||'' : '';
    const tally = p ? Object.values(p.votes).join('') : '';
    return base + '|' + (p?.id||'') + '|' + myVote + '|' + tally;
  }
  if(s.phase==='scores' || s.phase==='final'){
    return base + '|' + Object.entries(s.players).map(([id,p])=>`${id}:${p.score}`).join(',');
  }
  return base + '|' + Object.entries(s.players).map(([id,p])=>`${id}:${p.name}:${p.color}`).join(',');
}

function updateTimerOnly(showTimer, left){
  const t = document.querySelector('.timer');
  if(showTimer){
    if(t){ t.textContent = left+'s'; t.classList.toggle('warn', left<=5); }
  } else if(t){ t.remove(); }
  const mega = document.querySelector('.timer-mega');
  if(showTimer && left<=3 && left>0){
    if(!mega){
      const d=document.createElement('div'); d.className='timer-mega'; d.textContent=left;
      document.body.appendChild(d);
    } else mega.textContent = left;
  } else if(mega) mega.remove();
}

function playerRender(){
  if(!viewState){
    app.innerHTML = `<div class="center"><div class="stack" style="text-align:center"><h1>${roomCode}</h1><div class="sub">Connecting to host…</div><div class="help">Make sure the host's screen is open.</div></div></div>`;
    return;
  }
  const s = viewState;
  const myP = s.players[me.id];
  const left = Math.max(0, Math.ceil((s.deadline - Date.now())/1000));
  const showTimer = ['answering','voting'].includes(s.phase);

  // Auto-submit when answering timer hits zero
  if(s.phase === 'answering' && left === 0){
    autoSubmitRemaining();
  }

  const sig = playerSig(s, myP);
  if(sig === lastPlayerSig){
    updateTimerOnly(showTimer, left);
    return;
  }
  lastPlayerSig = sig;

  let body = '';
  if(s.phase==='lobby') body = renderPlayerLobby(myP);
  else if(s.phase==='answering') body = renderPlayerAnswering(myP);
  else if(s.phase==='voting') body = renderPlayerVoting(myP);
  else if(s.phase==='reveal') body = renderPlayerReveal(myP);
  else if(s.phase==='scores') body = renderPlayerScores(myP);
  else if(s.phase==='final') body = renderPlayerFinal(myP);

  app.innerHTML = `
    ${showTimer ? `<div class="timer ${left<=5?'warn':''}">${left}s</div>` : ''}
    <div class="header">
      <div>${wordmarkHTML('ZANTANA','sm')}</div>
      <div class="row" style="gap:8px;align-items:center">
        <div class="pill"><span class="dot" style="background:${myP?.color || '#fff'}"></span>${escapeHtml(me.name)} · ${(myP?.score||0).toLocaleString()}</div>
        <button class="pill" id="exitBtn" style="background:rgba(255,51,85,.16);color:var(--red);border-color:rgba(255,51,85,.35);cursor:pointer">Exit</button>
      </div>
    </div>
    <div class="center"><div class="stack fade-in">${body}</div></div>
  `;
  attachPlayerHandlers();
  const exitB = document.getElementById('exitBtn');
  if(exitB) exitB.onclick = leaveGame;

  if(s.phase==='final' && lastFinalPid !== me.id){
    lastFinalPid = me.id;
    const players = Object.entries(s.players).sort((a,b)=>b[1].score-a[1].score);
    if(players[0]?.[0]===me.id) fireBigConfetti();
  }
  if(s.phase!=='final') lastFinalPid = null;
}

function renderPlayerLobby(){
  const others = Object.entries(viewState.players);
  const autoStart = viewState.autoStartScheduled;
  return `
    <h1 style="text-align:center">You're in!</h1>
    <div class="sub" style="text-align:center">Room <strong>${roomCode}</strong> · ${autoStart?'<span style="color:var(--green);font-weight:800">starting in a moment…</span>':'waiting for host to start'}</div>
    <div style="height:var(--s4)"></div>
    <div style="display:flex;flex-wrap:wrap;gap:var(--s4);justify-content:center;align-items:flex-end">
      ${others.map(([id,p])=>`
        <div class="avatar-wrap${id===me.id?' fresh':''}">
          ${avatarSVG(p.color, id, 56)}
          <span class="avatar-name">${escapeHtml(p.name)}${id===me.id?' (you)':''}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function pickPillsForPrompt(promptId, n=4){
  const out = [];
  const h = hashStr(String(promptId||''));
  const used = new Set();
  let i = 0;
  while(out.length < n && i < BOT_ANSWERS.length*2){
    const idx = (h + i*13 + Math.floor(Math.random()*BOT_ANSWERS.length*0.3)) % BOT_ANSWERS.length;
    if(!used.has(idx)){ out.push(BOT_ANSWERS[idx]); used.add(idx); }
    i++;
  }
  return out;
}

function renderPlayerAnswering(){
  const mine = viewState.prompts.filter(p => p.a.includes(me.id));
  if(mine.length===0) return `<div class="empty-state">You're not in this round somehow. Sit tight.</div>`;
  const remaining = mine.filter(p => !(p.ans[me.id]||'').trim());
  if(remaining.length===0){
    return `<div class="prompt-box" style="text-align:center">
      <div class="display" style="font-size:48px;color:var(--green)">✓</div>
      <h2 style="margin-top:var(--s3)">All in</h2>
      <div class="sub" style="margin-top:var(--s2)">Waiting on the others…</div>
    </div>`;
  }
  const p = remaining[0];
  const idx = mine.length - remaining.length + 1;
  const pills = pickPillsForPrompt(p.id, 4);
  return `
    <div class="prompt-box">
      <div class="sub" style="margin-bottom:var(--s2);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--orange)">Prompt ${idx} of ${mine.length}</div>
      <div style="font-family:var(--display);font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.2;margin-bottom:var(--s4)">${renderPromptText(p.text)}</div>
      <textarea data-pid="${p.id}" rows="2" maxlength="140" placeholder="The funniest answer wins…" autofocus></textarea>
      <div class="quick-pills">
        ${pills.map(t=>`<button type="button" class="quick-pill" data-fill="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
      </div>
      <div style="height:var(--s3)"></div>
      <button class="btn submit-ans" data-pid="${p.id}" style="width:100%">Submit</button>
      <div class="sub" style="text-align:center;margin-top:var(--s2);font-size:12px;color:var(--ink-muted)">Time runs out → whatever you've typed gets sent automatically.</div>
    </div>
  `;
}

function renderPromptText(text){
  return escapeHtml(text).replace(/_{3,}/g, '<span class="blank-ph"></span>');
}
function renderFilled(text, answer, color){
  if(/_{3,}/.test(text)){
    const safeAns = escapeHtml(answer);
    return escapeHtml(text).replace(/_{3,}/, `<span class="blank-filled" style="color:${color};border-color:${color};background:color-mix(in srgb, ${color} 22%, transparent)">${safeAns}</span>`);
  }
  return null; // caller falls back to plain answer display
}

function renderPlayerVoting(){
  const p = viewState.prompts[viewState.voteIdx];
  if(!p) return '<div class="empty-state">…</div>';
  if(p.a.includes(me.id)){
    return `
      <div class="prompt-box">
        <div class="sub" style="margin-bottom:var(--s2);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--green)">This one's yours</div>
        <div style="font-family:var(--display);font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.2">${renderPromptText(p.text)}</div>
        <div class="sub" style="text-align:center;margin-top:var(--s5)">Sit back. Watch them suffer.</div>
      </div>
    `;
  }
  const myVote = p.votes[me.id];
  const [aId,bId] = p.a;
  const aP = viewState.players[aId], bP = viewState.players[bId];
  const hasBlank = /_{3,}/.test(p.text);
  const showNames = !!myVote; // names revealed to YOU only after you pick
  const neutral = 'rgba(255,255,255,.18)';
  const aBorder = showNames ? aP.color : neutral;
  const bBorder = showNames ? bP.color : neutral;
  const aFilled = renderFilled(p.text, p.ans[aId]||'?', showNames ? aP.color : 'var(--orange)');
  const bFilled = renderFilled(p.text, p.ans[bId]||'?', showNames ? bP.color : 'var(--orange)');
  return `
    <div class="sub" style="text-align:center;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--ink-muted)">Vote · ${viewState.voteIdx+1} of ${viewState.prompts.length}</div>
    ${hasBlank ? '' : `<div style="font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.15;text-align:center;padding:var(--s3) 0">"${escapeHtml(p.text)}"</div>`}
    <button class="answer-card vote-btn ${myVote==='a'?'voted':''}" data-choice="a" data-pid="${p.id}" style="border-color:${aBorder}">
      <div>${aFilled || escapeHtml(p.ans[aId]||'(no answer)')}</div>
      ${showNames ? `<div class="author" style="color:${aP.color}">${escapeHtml(aP.name)}</div>` : ''}
    </button>
    <div class="versus">VS</div>
    <button class="answer-card vote-btn ${myVote==='b'?'voted':''}" data-choice="b" data-pid="${p.id}" style="border-color:${bBorder}">
      <div>${bFilled || escapeHtml(p.ans[bId]||'(no answer)')}</div>
      ${showNames ? `<div class="author" style="color:${bP.color}">${escapeHtml(bP.name)}</div>` : ''}
    </button>
    ${myVote?`<div class="sub" style="text-align:center;color:var(--green);font-weight:800">Vote locked — you picked <span style="color:${myVote==='a'?aP.color:bP.color}">${escapeHtml(myVote==='a'?aP.name:bP.name)}</span>'s</div>`:''}
  `;
}

function renderPlayerReveal(){
  const p = viewState.prompts[viewState.voteIdx];
  if(!p) return '';
  const counts = { a:0, b:0 };
  for(const v of Object.values(p.votes)) counts[v]++;
  const total = counts.a + counts.b || 1;
  const [aId,bId] = p.a;
  const aP = viewState.players[aId], bP = viewState.players[bId];
  const hasBlank = /_{3,}/.test(p.text);
  const aFilled = renderFilled(p.text, p.ans[aId]||'?', aP.color);
  const bFilled = renderFilled(p.text, p.ans[bId]||'?', bP.color);
  return `
    ${hasBlank ? '' : `<div style="font-family:var(--display);font-weight:800;font-size:clamp(20px,5vw,28px);line-height:1.15;text-align:center">"${escapeHtml(p.text)}"</div>`}
    <div class="sub" style="text-align:center;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px">Results</div>
    <div class="answer-card" style="border-color:${aP.color}">
      <div>${aFilled || escapeHtml(p.ans[aId])}</div>
      <div class="author" style="color:${aP.color}">${escapeHtml(aP.name)} · ${counts.a} vote${counts.a===1?'':'s'}</div>
      <div class="vote-bar"><div style="width:${counts.a/total*100}%;background:${aP.color}"></div></div>
    </div>
    <div class="answer-card" style="border-color:${bP.color}">
      <div>${bFilled || escapeHtml(p.ans[bId])}</div>
      <div class="author" style="color:${bP.color}">${escapeHtml(bP.name)} · ${counts.b} vote${counts.b===1?'':'s'}</div>
      <div class="vote-bar"><div style="width:${counts.b/total*100}%;background:${bP.color}"></div></div>
    </div>
  `;
}

function renderPlayerScores(){
  const players = Object.entries(viewState.players).sort((a,b)=>b[1].score-a[1].score);
  return `
    <h2 style="text-align:center">Scores · Round ${viewState.round}</h2>
    <div class="scoreboard">
      ${players.map(([id,p],i)=>`
        <div class="score-row${id===me.id?' me':''}" style="--accent:${p.color}">
          <span class="rank">${i+1}</span>
          <span class="nm">${escapeHtml(p.name)}${id===me.id?' (you)':''}</span>
          <span class="pts">${p.score.toLocaleString()}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderPlayerFinal(){
  const players = Object.entries(viewState.players).sort((a,b)=>b[1].score-a[1].score);
  const won = players[0]?.[0]===me.id;
  return `
    <div style="text-align:center">
      <div class="sub" style="font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:${won?'var(--green)':'var(--ink-muted)'}">${won?'You won':'GG'}</div>
      <h1 style="font-size:clamp(48px,15vw,96px);margin:var(--s2) 0">${won?'🏆':''} ${escapeHtml(me.name)}</h1>
    </div>
    <div class="scoreboard">
      ${players.map(([id,p],i)=>`
        <div class="score-row${id===me.id?' me':''}" style="--accent:${p.color}">
          <span class="rank">${i+1}</span>
          <span class="nm">${escapeHtml(p.name)}${id===me.id?' (you)':''}</span>
          <span class="pts">${p.score.toLocaleString()}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function autoSubmitRemaining(){
  if(!viewState || !channel || viewState.phase !== 'answering') return;
  const mine = viewState.prompts.filter(p => p.a.includes(me.id));
  let didAny = false;
  for(const p of mine){
    if((p.ans[me.id]||'').trim()) continue;
    const ta = document.querySelector(`textarea[data-pid="${p.id}"]`);
    const typed = ta ? (ta.value||'').trim() : '';
    const text = typed || BOT_ANSWERS[Math.floor(Math.random()*BOT_ANSWERS.length)];
    channel.pub(`${TOPIC_PREFIX}/${roomCode}/cmd`, 'answer', { pid: me.id, promptId: p.id, text });
    p.ans[me.id] = text;
    didAny = true;
  }
  if(didAny){ lastPlayerSig = ''; playerRender(); }
}

function attachPlayerHandlers(){
  document.querySelectorAll('.quick-pill').forEach(b=>{
    b.onclick = ()=>{
      const ta = document.querySelector('textarea[data-pid]');
      if(ta){ ta.value = b.dataset.fill || b.textContent; ta.focus(); }
    };
  });
  document.querySelectorAll('.submit-ans').forEach(btn=>{
    btn.onclick = ()=>{
      const pid = btn.dataset.pid;
      const ta = document.querySelector(`textarea[data-pid="${pid}"]`);
      const text = (ta.value||'').trim();
      if(text.length<1){ ta.classList.add('shake'); setTimeout(()=>ta.classList.remove('shake'),400); return; }
      channel.pub(`${TOPIC_PREFIX}/${roomCode}/cmd`, 'answer', { pid: me.id, promptId: pid, text });
      // Optimistic local state so the next prompt shows immediately
      const cp = viewState?.prompts?.find(x=>x.id===pid);
      if(cp){ cp.ans = { ...(cp.ans||{}), [me.id]: text }; }
      ta.disabled = true; btn.disabled = true;
      lastPlayerSig = '';
      playerRender();
    };
  });
  document.querySelectorAll('.vote-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.classList.contains('voted')) return;
      const pid = btn.dataset.pid;
      const choice = btn.dataset.choice;
      channel.pub(`${TOPIC_PREFIX}/${roomCode}/cmd`, 'vote', { voterId: me.id, promptId: pid, choice });
      document.querySelectorAll('.vote-btn').forEach(b=>b.classList.remove('voted'));
      btn.classList.add('voted');
    };
  });
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>
</body>
</html>
